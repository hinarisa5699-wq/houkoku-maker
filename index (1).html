    + '<table class="rp-log"><colgroup><col style="width:7%"><col style="width:16%"><col style="width:10%"><col style="width:17%"><col style="width:9%"><col style="width:10%"><col style="width:9%"><col style="width:22%"></colgroup>'
    +   '<thead><tr><th>日</th><th>ﾓｰﾆﾝｸﾞｺｰﾙ</th><th>ｵﾝｺｰﾙ</th><th>服薬確認</th><th>朝</th><th>昼</th><th>夕</th><th>特記</th></tr></thead>'
    +   "<tbody>"+rows+"</tbody></table>"
    + (p.narrative ? '<div class="rp-band">1ヶ月のまとめ</div><div class="rp-narr" style="min-height:20mm">'+esc(p.narrative)+"</div>" : "")
    + "</section>";
}

/* ============================ 描画 ============================ */
function renderAll(){ renderRoster(); renderEditor(); renderSheets(); }

function renderSettings(){
  const c = cfg();
  const grid = document.getElementById("settingsGrid");
  grid.innerHTML = c.fields.map(([key,label,ph])=>{
    const type = ph === "date" ? "date" : "text";
    const placeholder = ph === "date" ? "" : ph;
    return '<div class="field"'+(key==="residents"?' style="grid-column:1/-1"':"")+'><label for="f_'+key+'">'+esc(label)+"</label>"
      + '<input id="f_'+key+'" type="'+type+'" placeholder="'+esc(placeholder)+'"></div>';
  }).join("");
  document.getElementById("settingsHint").textContent = c.hint;
  for (const [key] of c.fields){
    const el = document.getElementById("f_"+key);
    el.addEventListener("input", ()=>{
      settings[mode] = settings[mode] || {};
      settings[mode][key] = el.value;
      save(); renderSheets();
      if (key === "kinyuList" || key === "kinyu"){ renderEditor(); renderRoster(); }
      if (key === "residents" || key === "logUser") ingestHouse();
    });
  }
  fillSettings();
}
function fillSettings(){
  const c = cfg();
  const {y,m} = ymParts(ym);
  settings[mode] = { ...c.defaults, ...(settings[mode]||{}) };
  for (const [key,,ph] of c.fields){
    const el = document.getElementById("f_"+key);
    if (!el || document.activeElement === el) continue;
    el.value = (key === "reportDate")
      ? (settings[mode].reportDate || (ym ? ym+"-"+String(lastDay(y,m)).padStart(2,"0") : ""))
      : (settings[mode][key] || "");
  }
}
function applyMode(){
  const c = cfg();
  document.getElementById("h1").textContent = c.h1;
  document.getElementById("h3").textContent = c.step3;
  document.getElementById("dropBig").textContent = c.dropBig;
  document.getElementById("dropHint").textContent = c.dropHint;
  document.getElementById("fileInput").accept = c.accept;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.mode === mode)));
  const ga = document.getElementById("btnGenAll");
  ga.textContent = mode === "house" ? "まとめをまとめて作る" : "様子文をまとめて作る";
  renderSettings();
}

/* ============================ プレビューとPDF ============================ */
let previewOn = false;
function sheetCount(){ return document.querySelectorAll("#sheets .sheet").length; }
function echoHowTo(){
  const el = document.getElementById("pdfHowTo");
  if (!el) return;
  const each = document.getElementById("pdfMode").value === "each";
  el.textContent = each
    ? "「印刷（PDF保存）」を押すと1人1ファイルのPDFを続けて作ります。1件ずつ保存の確認が出ます。ファイル名は「" + docLabel() + "_中原様_" + ymTag() + ".pdf」の形です。"
    : "「印刷（PDF保存）」を押すとA4のPDFが1つ出来ます。保存したPDFを開いて印刷してください。";
}
function echoScope(){
  const sc = document.getElementById("printScope");
  const el = document.getElementById("scopeEcho");
  if (!sc || !el) return;
  el.textContent = sc.options[sc.selectedIndex].text;
}
function updatePreviewCount(){
  const el = document.getElementById("previewCount");
  if (!el) return;
  const n = sheetCount();
  el.textContent = n ? n + "ページ（1人1ページ）" : "対象の方がいません";
}
function openPreview(){
  renderSheets();
  previewOn = true;
  document.getElementById("sheets").classList.add("show");
  document.getElementById("previewBar").classList.add("show");
  updatePreviewCount();
  const bar = document.getElementById("previewBar");
  const th = document.querySelector(".topbar").offsetHeight;
  bar.style.top = th + "px";
  const top = bar.getBoundingClientRect().top + window.pageYOffset - th;
  window.scrollTo({ top, behavior:"smooth" });
}
function closePreview(){
  previewOn = false;
  if (onlyKey){ onlyKey = null; renderSheets(); }
  document.getElementById("sheets").classList.remove("show");
  document.getElementById("previewBar").classList.remove("show");
}
function docLabel(){ return mode === "house" ? "ハウス記録" : cfg().label + "報告"; }
function ymTag(){ const {y,m} = ymParts(ym); return String(y).slice(2) + "." + m; }
function personTag(p){
  const full = (p.name||"").replace(/[ 　]/g,"");
  const sn = surname(p.name||"").replace(/[ 　]/g,"");
  let dup = 0;
  for (const k in people) if (surname(people[k].name||"").replace(/[ 　]/g,"") === sn) dup++;
  return (dup > 1 ? full : sn) + "様";
}
function pdfName(){
  if (onlyKey && people[onlyKey]) return docLabel() + "_" + personTag(people[onlyKey]) + "_" + ymTag() + ".pdf";
  return docLabel() + "_" + ymTag() + ".pdf";
}
function targetKeys(){
  const scope = document.getElementById("printScope").value;
  return sortedKeys().filter(k=>{
    const p = people[k];
    if (onlyKey) return k === onlyKey;
    if (p.exclude) return false;
    if (scope === "done" && !p.confirmed) return false;
    if (scope === "pick" && !p.pick) return false;
    return true;
  });
}
async function makePdfEach(btn){
  const keys = targetKeys();
  if (!keys.length){ notify("対象の方がいません。印刷範囲を確認してください。","warn"); return; }
  notify(keys.length + "人分を1人ずつPDFにします。1件ずつ保存の確認が出ます。");
  const state = document.getElementById("pdfState");
  btn.disabled = true; const old = btn.textContent;
  let done = 0;
  try {
    for (let i=0;i<keys.length;i++){
      onlyKey = keys[i];
      btn.textContent = "作成中… " + (i+1) + "/" + keys.length;
      if (state) state.textContent = people[keys[i]].name + " を作成中…";
      const ok = await buildAndSave(btn, true);
      if (ok === "declined") break;
      if (ok) done++;
    }
  } finally {
    onlyKey = null; renderSheets();
    btn.disabled = false; btn.textContent = old;
    if (state) state.textContent = done ? done + "件保存しました" : "";
  }
}
async function makePdf(btn){
  const each = document.getElementById("pdfMode").value === "each";
  if (each && !onlyKey) return makePdfEach(btn);
  const state = document.getElementById("pdfState");
  btn.disabled = true; const old = btn.textContent;
  try { await buildAndSave(btn, false); }
  finally { btn.disabled = false; btn.textContent = old; }
}
async function buildAndSave(btn, quiet){
  renderSheets();
  const sheets = Array.from(document.querySelectorAll("#sheets .sheet"));
  if (!sheets.length){ if (!quiet) notify("対象の方がいません。印刷範囲を確認してください。","warn"); return false; }
  if (typeof html2canvas === "undefined" || !window.jspdf){ notify("PDFの部品を読み込めませんでした。通信環境を確認して、画面を開き直してください。","err"); return false; }
  const wasOpen = previewOn;
  if (!wasOpen) document.getElementById("sheets").classList.add("show");
  const state = document.getElementById("pdfState");
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"mm", format:"a4", orientation:"portrait", compress:true });
    for (let i=0;i<sheets.length;i++){
      if (!quiet){ btn.textContent = "作成中… " + (i+1) + "/" + sheets.length; if (state) state.textContent = "作成中… " + (i+1) + "/" + sheets.length; }
      const canvas = await html2canvas(sheets[i], { scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false });
      const W = 196, H = 289, X = (210-W)/2, Y = 4;
      const full = W * canvas.height / canvas.width;
      if (full <= H + 2){
        if (i > 0) doc.addPage();
        doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", X, Y, W, full, undefined, "FAST");
      } else {
        const pxPerMm = canvas.width / W;
        const sliceH = Math.floor(H * pxPerMm);
        let first = true;
        for (let off=0; off<canvas.height; off+=sliceH){
          const hpx = Math.min(sliceH, canvas.height - off);
          const c2 = document.createElement("canvas");
          c2.width = canvas.width; c2.height = hpx;
          const ctx = c2.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,c2.width,c2.height);
          ctx.drawImage(canvas, 0, off, canvas.width, hpx, 0, 0, canvas.width, hpx);
          if (i > 0 || !first) doc.addPage();
          first = false;
          doc.addImage(c2.toDataURL("image/jpeg", 0.92), "JPEG", X, Y, W, hpx / pxPerMm, undefined, "FAST");
        }
      }
    }
    const blob = doc.output("blob");
    const dl = await claudeUse("downloads");
    if (!dl){
      if (!saveBlob(blob, pdfName())){
        notify("この画面ではダウンロードを使えません。プレビューを開いて「ブラウザの印刷を試す」からPDFに保存してください。","err");
        return false;
      }
      if (state && !quiet) state.textContent = "保存しました";
      return true;
    }
    await dl.save({ filename: pdfName(), data: blob });
    if (state && !quiet) state.textContent = "保存しました";
    return true;
  } catch(e){
    const code = e && e.code;
    if (code === "declined"){ if (state) state.textContent = ""; return "declined"; }
    if (code === "too_large") notify("PDFが大きすぎます。「1人ずつ別のPDF」に切り替えるか、人数を分けて出してください。","err");
    else notify("PDFを作れませんでした。もう一度お試しください。","err");
    return false;
  } finally {
    if (!wasOpen) document.getElementById("sheets").classList.remove("show");
  }
}
function saveBlob(blob, filename){
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  } catch(e){ return false; }
}
let _dlNs = undefined;
async function claudeUse(name){
  if (name === "downloads" && _dlNs !== undefined) return _dlNs;
  if (!(window.claude && window.claude.use)) return null;
  try { const ns = await window.claude.use(name); if (name === "downloads") _dlNs = ns; return ns; }
  catch(e){ if (name === "downloads") _dlNs = null; return null; }
}

/* ============================ 初期化 ============================ */
function initDrop(){
  const dz = document.getElementById("drop"), fi = document.getElementById("fileInput");
  dz.addEventListener("click", ()=>fi.click());
  dz.addEventListener("keydown", e=>{ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); fi.click(); }});
  fi.addEventListener("change", ()=>{ if (fi.files.length) handleFiles(Array.from(fi.files)); fi.value=""; });
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove("over"); }));
  dz.addEventListener("drop", e=>{ const f = Array.from(e.dataTransfer.files||[]); if (f.length) handleFiles(f); });
}

(function init(){
  try { const s = localStorage.getItem(LS.s); if (s) settings = JSON.parse(s) || {}; } catch(e){}
  for (const k in MODES) settings[k] = { ...MODES[k].defaults, ...(settings[k]||{}) };
  ym = nowYm();
  try {
    const last = JSON.parse(localStorage.getItem(LS.last) || "null");
    if (last && MODES[last.mode]) mode = last.mode;
    if (last && /^\d{4}-\d{2}$/.test(last.ym||"")) ym = last.ym;
  } catch(e){}
  const ymEl = document.getElementById("ym");
  ymEl.value = ym;
  ymEl.addEventListener("change", ()=>{ if (!ymEl.value) return; ym = ymEl.value; fillSettings(); loadMonth(); });

  applyMode();
  wireGenAll();
  echoHowTo();
  initDrop();
  loadMonth();

  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click", ()=>{ if (mode === t.dataset.mode) return; mode = t.dataset.mode; applyMode(); loadMonth(); });
  });
  document.getElementById("printScope").addEventListener("change", ()=>{ onlyKey = null; echoScope(); renderSheets(); if (previewOn) openPreview(); });
  echoScope(); echoHowTo();
  document.getElementById("btnPreview").addEventListener("click", ()=>{ previewOn ? closePreview() : openPreview(); });
  document.getElementById("btnClosePreview").addEventListener("click", closePreview);
  document.getElementById("btnPrint2").addEventListener("click", ()=>{ try { window.print(); } catch(e){ notify("この画面からは印刷できません。「印刷（PDF保存）」からPDFにしてください。","warn"); } });
  document.getElementById("pdfMode").addEventListener("change", echoHowTo);
  document.getElementById("btnPdf").addEventListener("click", e=>makePdf(e.currentTarget));
  document.getElementById("btnPdf2").addEventListener("click", e=>makePdf(e.currentTarget));
  document.getElementById("btnPreview2").addEventListener("click", ()=>{ previewOn ? closePreview() : openPreview(); });
  document.getElementById("btnCloseEd").addEventListener("click", ()=>{ selected=null; renderRoster(); renderEditor(); });
  document.getElementById("btnClear").addEventListener("click", e=>{
    arm(e.currentTarget, "この月の読み込み結果と入力を全部消します。取り消せません。", ()=>{
      people = {}; selected = null; files = []; renderFiles();
      document.getElementById("parseMsg").innerHTML = "";
      save(); renderAll();
      notify("この月の内容を消しました。");
    });
  });

  if (window.claude && window.claude.use){
    window.claude.use("db").then(x=>{
      db = x;
      if (!db) return;
      showStore("");
      db.doc("config/settings").onSnapshot(snap=>{
        if (!snap.exists || snap.metadata.hasPendingWrites) return;
        const d = snap.data() || {};
        for (const k in MODES) settings[k] = { ...MODES[k].defaults, ...(d[k]||{}) };
        fillSettings(); renderSheets();
      }, ()=>{});
      loadMonth();
    });
    window.claude.use("sample").then(x=>{
      sample = x;
      const ga = document.getElementById("btnGenAll");
      wireGenAll();
      if (selected) renderEditor();
    });
  } else {

  }
})();
</script>
